<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760"><style>.h{font:800 36px Arial;fill:#173e35}.e{fill:#fffdf7;stroke:#137a67;stroke-width:2}.t{font:700 20px Arial;fill:#132722}.f{font:14px Arial;fill:#52645e}.r{stroke:#ed6b43;stroke-width:3;fill:none}</style><rect width="1300" height="760" fill="#f6f3e9"/><text x="55" y="65" class="h">RouteRelay Data Model</text><g transform="translate(60 120)"><rect class="e" rx="14" width="220" height="140"/><text x="20" y="35" class="t">USERS</text><text x="20" y="68" class="f">email · role · operatorId</text><text x="20" y="94" class="f">passwordHash</text><text x="20" y="120" class="f">1 → many sessions/bookings</text></g><g transform="translate(380 120)"><rect class="e" rx="14" width="220" height="140"/><text x="20" y="35" class="t">OPERATORS</text><text x="20" y="68" class="f">name</text><text x="20" y="94" class="f">1 → many buses/users/trips</text></g><g transform="translate(700 120)"><rect class="e" rx="14" width="220" height="140"/><text x="20" y="35" class="t">BUSES</text><text x="20" y="68" class="f">registration · operatorId</text><text x="20" y="94" class="f">embedded seat labels</text></g><g transform="translate(1020 120)"><rect class="e" rx="14" width="220" height="140"/><text x="20" y="35" class="t">ROUTES</text><text x="20" y="68" class="f">name</text><text x="20" y="94" class="f">ordered embedded stops</text></g><g transform="translate(190 390)"><rect class="e" rx="14" width="270" height="190"/><text x="20" y="35" class="t">BOOKINGS</text><text x="20" y="68" class="f">PNR · userId · tripId</text><text x="20" y="94" class="f">passenger · seat · journey</text><text x="20" y="120" class="f">status · refund · policy snapshot</text><text x="20" y="146" class="f">replacement history</text><text x="20" y="172" class="f">unique confirmed trip + seat</text></g><g transform="translate(610 360)"><rect class="e" rx="14" width="300" height="240"/><text x="20" y="35" class="t">TRIPS</text><text x="20" y="68" class="f">busId · routeId · operatorId</text><text x="20" y="94" class="f">departure · arrival · fare</text><text x="20" y="120" class="f">seat/stop/route snapshots</text><text x="20" y="146" class="f">cancellation policy</text><text x="20" y="172" class="f">status · disruption reason</text><text x="20" y="198" class="f">revision for stale-write protection</text></g><g transform="translate(1010 420)"><rect class="e" rx="14" width="230" height="140"/><text x="20" y="35" class="t">AUDIT</text><text x="20" y="68" class="f">actorId · tripId · action</text><text x="20" y="94" class="f">details · timestamp</text></g><path d="M280 200 H375" class="r"/><path d="M600 200 H695" class="r"/><path d="M920 220 L1070 385 L900 455" class="r"/><path d="M810 260 L780 355" class="r"/><path d="M500 260 L680 355" class="r"/><path d="M280 260 L310 385" class="r"/><path d="M460 480 H605" class="r"/><path d="M915 480 H1005" class="r"/></svg>
